[package]
name = "whisp"
version = "0.1.4"
edition = "2024"
authors = ["Dávid Tóth <toth.david.munka@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
voxelhex = { path = "../." }
bevy = { version = "0.17.0", features = ["wayland"] }
bevy_lunex = { git = "https://github.com/bytestring-net/bevy_lunex.git" }
bevy_pkv = "0.14.0"
bevy_panorbit_camera = "0.29.0"
serde = { version = "1", features = [
    "derive",
] } # for custom structs in bevy_pkv

[[bin]]
name = "whisp"
path = "src/main.rs"
